name: SubAgent Hub Contract

on:
  pull_request:
    branches: [main]
    paths:
      - AGENTS.md
      - README.md
      - Design/**
      - Specs/**
      - Registry/**
      - Schemas/**
      - SubAgents/**
      - Packages/com.darumappap.artist-subagent/**
      - src/UnityArtist.Cli/**
      - Tests/Compatibility/support-matrix.yaml
      - Tests/Hub/**
      - .github/workflows/subagent-hub-contract.yml
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - README.md
      - Design/**
      - Specs/**
      - Registry/**
      - Schemas/**
      - SubAgents/**
      - Packages/com.darumappap.artist-subagent/**
      - src/UnityArtist.Cli/**
      - Tests/Compatibility/support-matrix.yaml
      - Tests/Hub/**
      - .github/workflows/subagent-hub-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hub:
    name: Validate registry, manifests, and snapshot contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install YAML validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate repository authority and mirrored declarations
        run: python Tests/Hub/validate_repository_authority.py
      - name: Validate every registered SubAgent manifest
        run: python Tests/Hub/validate_registry.py
      - name: Test Hub validation failures and multi-agent registration
        run: python -m unittest discover -s Tests/Hub -p 'test_*.py' -v
      - name: Export and validate consumer-neutral Hub snapshot
        run: python Tests/Hub/export_agent_snapshot.py --output "$RUNNER_TEMP/subagent-catalog.yaml"
