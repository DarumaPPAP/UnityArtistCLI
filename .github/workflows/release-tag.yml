name: UnityArtistCLI Release

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: Publish the canonical VERSION from main as an immutable prerelease
        required: true
        type: boolean
        default: false

jobs:
  release:
    name: Human-gated package release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve canonical release tag
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Artist release workflow must run from main. Current ref: $GITHUB_REF"
            exit 1
          fi
          if [ "$CONFIRM_RELEASE" != "true" ]; then
            echo "::error::Check confirm_release before publishing an Artist release."
            exit 1
          fi
          version="$(tr -d '\r\n' < VERSION)"
          if [ -z "$version" ]; then
            echo "::error::VERSION is empty."
            exit 1
          fi
          tag="v$version"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists; refusing to move or replace it."
            exit 1
          fi
          echo "Canonical Artist release tag: $tag"
      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - name: Validate contracts
        run: |
          python3 Tests/Release/verify_unity_artist_contract.py
          python3 Tests/Compatibility/verify-unity-api-compatibility.py
      - name: Build host CLI
        run: dotnet publish src/UnityArtist.Cli/UnityArtist.Cli.csproj --configuration Release --runtime win-x64 --self-contained true --output build/host-windows-x64
      - name: Package Windows host CLI
        run: |
          set -euo pipefail
          mkdir -p artifacts
          (cd build/host-windows-x64 && zip -qr "$GITHUB_WORKSPACE/artifacts/UnityArtistCLI-host-windows-x64.zip" .)
          sha256sum artifacts/UnityArtistCLI-host-windows-x64.zip > artifacts/UnityArtistCLI-host-windows-x64.zip.sha256
      - name: Pack Unity package
        run: |
          mkdir -p artifacts
          (cd Packages/com.darumappap.artist-subagent && npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts")
          (cd artifacts && sha256sum *.zip *.tgz > SHA256SUMS.txt)
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Create immutable tag
        run: git tag -a "$RELEASE_TAG" -m "ArtistSubAgent Backend $RELEASE_TAG"
      - name: Push immutable tag
        run: git push origin "$RELEASE_TAG"
      - name: Create GitHub prerelease with host archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --prerelease \
            --title "ArtistSubAgent Backend $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md \
            artifacts/UnityArtistCLI-host-windows-x64.zip \
            artifacts/UnityArtistCLI-host-windows-x64.zip.sha256 \
            artifacts/SHA256SUMS.txt \
            artifacts/*.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: ArtistSubAgent-Backend-${{ env.RELEASE_TAG }}-Distribution
          path: artifacts
