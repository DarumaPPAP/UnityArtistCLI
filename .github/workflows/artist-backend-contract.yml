name: ArtistSubAgent Backend Contract

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: artist-backend-contract-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate-backend:
    name: Validate Artist backend source and compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate Artist backend contract
        run: python ci/verify/verify_artist_backend_contract.py
      - name: Validate Unity API compatibility
        run: python ci/verify/verify-unity-api-compatibility.py
      - name: Validate semantic naming
        run: python ci/verify/verify-semantic-names.py
      - name: Validate portable paths
        run: python ci/verify/verify_portable_paths.py
      - name: Validate preserved historical compatibility records
        run: |
          python ci/verify/verify-historical-evidence.py
          python ci/verify/verify-2022-3-bounded-fallback-evidence.py
          python ci/verify/verify-primary-urp-evidence.py
          python ci/verify/verify-cinematic-evidence.py
          python ci/verify/verify-hdrp-primary-evidence.py
          python ci/verify/verify-hdrp-cinematic-evidence.py
          python ci/verify/verify-cli-pipeline-gate-evidence.py
      - name: Validate minimal smoke contract
        run: python -m unittest tests/integration/test_minimal_smoke_contract.py
      - name: Build Artist host CLI
        run: dotnet build cli/artist/UnityArtist.Cli.csproj --configuration Release
      - name: Test Artist CLI host contracts
        run: python -m unittest discover -s cli/artist/tests -p 'test_*.py' -v
