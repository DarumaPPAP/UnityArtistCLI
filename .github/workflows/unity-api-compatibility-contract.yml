name: UnityArtistCLI API Compatibility Contract

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - Packages/com.darumappap.artist-subagent/**/*.cs
      - Packages/com.darumappap.artist-subagent/**/*.asmdef
      - Packages/com.darumappap.artist-subagent/package.json
      - skills/unity-artist-unity-api-compatibility/**
      - Tests/Compatibility/**
      - Specs/Compatibility/**

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - name: Validate API compatibility
        run: python3 Tests/Compatibility/verify-unity-api-compatibility.py
