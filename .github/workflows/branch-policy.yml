name: Branch Policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-policy-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate-branch:
    name: Validate Branch Name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate branch policy
        run: python Hub/Tools/validate_branch_policy.py --branch "${{ github.head_ref || github.ref_name }}" --event "${{ github.event_name }}"
